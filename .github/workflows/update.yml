name: update-symbols

# Bun port of the upstream weekly Python job (.github/workflows/main.yml on master).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 5"

jobs:
  update-symbols:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # The Aphrody Bun glibc build needs glibc 2.43 (Ubuntu 26.04).
    container: ubuntu:26.04
    timeout-minutes: 60
    steps:
      - run: apt-get update -q && apt-get install -qy --no-install-recommends ca-certificates curl git jq unzip
      - uses: actions/checkout@v5
        with:
          ref: aphrody
          fetch-depth: 1
      # Aphrody Bun (aphrody-labs/bun releases, SHA256SUMS-checked). The repository action
      # aphrody-labs/bun/.github/actions/setup-bun cannot be used: the runner fails to unpack that repository.
      - name: Aphrody Bun
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/aphrody-labs/bun/releases?per_page=50" |
            jq -r '[.[] | select((.draft | not) and (.prerelease | not) and (.tag_name | startswith("aphrody-v")))][0].tag_name')
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://github.com/aphrody-labs/bun/releases/download/$tag/bun-linux-x64.zip"
          curl -fsSLO "https://github.com/aphrody-labs/bun/releases/download/$tag/SHA256SUMS.txt"
          grep -E " \*?bun-linux-x64\.zip$" SHA256SUMS.txt | sed "s/ \*/  /" | sha256sum -c -
          unzip -q bun-linux-x64.zip
          install -D -m 755 bun-linux-x64/bun "$HOME/.bun/bin/bun"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"
          "$HOME/.bun/bin/bun" --revision
      - uses: astral-sh/setup-uv@v6
      - run: bun install --frozen-lockfile
      - run: bun run update
      - run: bun run check
      - name: commit
        run: |
          git add -A symbols variablefont update
          git diff --staged --quiet || git -c user.name='GitHub Actions Bot' -c user.email='<>' commit -m 'chore(symbols): mise à jour depuis Google Fonts'
          git push origin aphrody
